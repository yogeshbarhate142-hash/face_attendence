<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Password Recovery · YogFace</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="premium"><main class="dashboard-main"><section class="panel auth"><div class="form-title"><span class="form-kicker">SECURE RECOVERY</span><h2>Reset admin password</h2><p>Use the recovery key configured by the service owner.</p></div>
<label>Admin email<input id="email" type="email" autocomplete="username" placeholder="Registered admin email"></label>
<label>Recovery key<input id="key" type="password" autocomplete="off" placeholder="Server recovery key"></label>
<label>New password <span class="field-hint">12+ characters</span><input id="password" type="password" autocomplete="new-password" placeholder="Choose a new password"></label>
<button id="reset" class="full-button">Reset password <span>↗</span></button><p id="msg" class="msg"></p><a href="/" class="soft">Return to YogFace</a></section></main><script src="/static/reset_admin.js"></script></body></html>
